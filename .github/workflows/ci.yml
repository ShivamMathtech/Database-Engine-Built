name: CDB build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Build, unit, integration and CLI tests
        run: make CC=${{ matrix.compiler }} MODE=${{ matrix.mode }} test
      - name: Stress 100000 rows
        run: make CC=${{ matrix.compiler }} MODE=${{ matrix.mode }} stress ROWS=100000
      - name: GCC static analysis
        if: matrix.compiler == 'gcc' && matrix.mode == 'debug'
        run: make lint
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [test-asan, test-ubsan]
    steps:
      - uses: actions/checkout@v4
      - run: make CC=gcc ${{ matrix.target }}
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=clang MODE=debug test
